name: Deploy Pac-Man Arcade to GitHub Pages

# GitHub Pages for this repo serves the `gh-pages` branch, so we publish the
# contents of pacman-game/ there. Pages then builds and deploys it.

on:
  push:
    branches: [main]
    paths:
      - 'pacman-game/**'
      - '.github/workflows/deploy-game.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish pacman-game/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pacman-game
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: ${{ github.sha }}"
