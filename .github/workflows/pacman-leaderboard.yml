name: Pac-Man leaderboard

# Players submit a score by opening a pre-filled issue from the game's
# "SUBMIT SCORE" button. The issue carries the run's replay (RNG seed + every
# input with its frame). This workflow re-simulates the run with the real game
# engine, accepts the score only if the replay reproduces it, records the best
# score per GitHub user, refreshes the README ranking, closes the issue and
# redeploys the game so the in-game board updates too.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: pacman-leaderboard
  cancel-in-progress: false

jobs:
  record:
    if: contains(github.event.issue.title, 'Pac-Man score')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Replay the run with the game engine
        id: verify
        continue-on-error: true
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node pacman-game/verify-replay.js | tee -a "$GITHUB_OUTPUT"

      - name: Record score
        id: record
        uses: actions/github-script@v7
        env:
          VERIFIED: ${{ steps.verify.outputs.verified }}
          VERIFIED_SCORE: ${{ steps.verify.outputs.score }}
          VERIFIED_COMMITS: ${{ steps.verify.outputs.commits }}
          VERIFIED_FRAMES: ${{ steps.verify.outputs.frames }}
          VERIFY_REASON: ${{ steps.verify.outputs.reason }}
        with:
          script: |
            const fs = require('fs');
            const issue = context.payload.issue;
            const user = issue.user.login;
            const number = issue.number;
            const LB_PATH = 'pacman-game/leaderboard.json';
            const README_PATH = 'README.md';
            const GAME_URL = 'https://alexvila0204.github.io/AlexVila0204/';
            const fmt = (n) => Number(n).toLocaleString('en-US');

            const say = (body) => github.rest.issues.createComment({ ...context.repo, issue_number: number, body });
            const close = (reason) => github.rest.issues.update({ ...context.repo, issue_number: number, state: 'closed', state_reason: reason });
            const label = async (name) => {
              try { await github.rest.issues.addLabels({ ...context.repo, issue_number: number, labels: [name] }); } catch (e) {}
            };

            core.setOutput('changed', 'false');
            if (issue.user.type === 'Bot') return;

            const verified = process.env.VERIFIED === 'true';
            const score = Number(process.env.VERIFIED_SCORE);
            const commits = Number(process.env.VERIFIED_COMMITS);
            const frames = Number(process.env.VERIFIED_FRAMES);
            const reason = process.env.VERIFY_REASON || 'unknown';

            if (!verified || !Number.isInteger(score) || score <= 0) {
              await label('pacman-score');
              await label('rejected');
              core.info(`Rejected: ${reason}`);
              await say([
                `👾 Nice try, @${user}.`,
                '',
                `Dude, it's a Pac-Man game on a README. Don't cheat, just play. 🕹️`,
                '',
                `Go earn it at ${GAME_URL} and hit **SUBMIT SCORE** when the run ends. I'll be watching.`
              ].join('\n'));
              await close('not_planned');
              return;
            }

            const data = JSON.parse(fs.readFileSync(LB_PATH, 'utf8'));
            const scores = Array.isArray(data.scores) ? data.scores : [];
            const today = new Date().toISOString().slice(0, 10);
            const existing = scores.find(s => s.user.toLowerCase() === user.toLowerCase());

            await label('pacman-score');
            if (existing && score <= existing.score) {
              const rank = scores.findIndex(s => s === existing) + 1;
              await say(`🕹️ Verified run, nice one @${user}! But your best on the board is still **${fmt(existing.score)}** (rank #${rank}). Beat it and submit again!`);
              await close('completed');
              return;
            }

            const seconds = Math.round(frames / 60);
            if (existing) {
              existing.score = score;
              existing.commits = commits;
              existing.seconds = seconds;
              existing.date = today;
              existing.issue = number;
            } else {
              scores.push({ user, score, commits, seconds, date: today, issue: number });
            }
            scores.sort((a, b) => b.score - a.score || a.date.localeCompare(b.date));
            data.scores = scores.slice(0, 50);
            data.updated = new Date().toISOString();
            data.maxScore = data.maxScore || 14700;
            fs.writeFileSync(LB_PATH, JSON.stringify(data, null, 2) + '\n');

            // README top 10
            const medals = ['🥇', '🥈', '🥉'];
            const rows = data.scores.slice(0, 10).map((s, i) =>
              `| ${medals[i] || i + 1} | <img src="https://github.com/${s.user}.png?size=24" width="24" height="24" alt="" /> [@${s.user}](https://github.com/${s.user}) | **${fmt(s.score)}** | ${s.date} |`
            );
            const table = ['| # | Player | Score | Date |', '| :-: | :-- | --: | :-: |', ...rows].join('\n');
            const readme = fs.readFileSync(README_PATH, 'utf8');
            const START = '<!-- PACMAN-LEADERBOARD:START -->';
            const END = '<!-- PACMAN-LEADERBOARD:END -->';
            const a = readme.indexOf(START);
            const b = readme.indexOf(END);
            if (a !== -1 && b !== -1 && b > a) {
              fs.writeFileSync(README_PATH, readme.slice(0, a + START.length) + '\n' + table + '\n' + readme.slice(b));
            }

            const rank = data.scores.findIndex(s => s.user.toLowerCase() === user.toLowerCase()) + 1;
            await say([
              `🏆 Replay verified frame by frame (${commits} commits eaten in ${seconds}s).`,
              '',
              `@${user} is now **#${rank}** on the GitHub Arcade leaderboard with **${fmt(score)}** points.`,
              '',
              `Your avatar is on my profile: https://github.com/${context.repo.owner} — and the in-game board updates in a minute.`
            ].join('\n'));
            await close('completed');
            core.setOutput('changed', 'true');
            core.setOutput('user', user);
            core.setOutput('score', String(score));

      - name: Commit leaderboard
        if: steps.record.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pacman-game/leaderboard.json README.md
          git commit -m "chore(leaderboard): @${{ steps.record.outputs.user }} scored ${{ steps.record.outputs.score }}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Redeploy game with the new board
        if: steps.record.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'deploy-game.yml',
              ref: 'main'
            });
